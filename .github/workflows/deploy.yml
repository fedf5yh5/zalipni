# Публикация сайта на GitHub Pages при каждом изменении в ветке main
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4

      - name: Настроить GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Собрать папку сайта
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'tools' --exclude 'README.md' --exclude '.gitignore'             --exclude '.gitattributes' --exclude 'firestore.rules' \
            ./ _site/
          node tools/set-site-url.js _site "${{ steps.pages.outputs.base_url }}"

      - name: Упаковать сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
