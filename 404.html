<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>
    // Эта страница открывается по любому неверному адресу, даже «глубокому».
    // Сначала говорим браузеру, где корень сайта, и только потом подключаем файлы —
    // иначе он заранее попробует загрузить их не из той папки.
    (function () {
      if (/^https?:$/.test(location.protocol)) {
        var seg = location.pathname.split('/')[1];
        var root = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
        document.write('<base href="' + root + '">');
      }
      document.write(
        '<link rel="icon" href="favicon.ico" sizes="32x32">' +
        '<link rel="icon" href="img/favicon.svg" type="image/svg+xml">' +
        '<link rel="stylesheet" href="css/style.css">' +
        '<script src="config.js" defer><\/script>' +
        '<script src="js/secrets.js" defer><\/script>' +
        '<script src="js/core.js" defer><\/script>' +
        '<script src="js/eggs.js" defer><\/script>'
      );
    })();
  </script>
  <noscript><link rel="stylesheet" href="css/style.css"></noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Залипни</title>
